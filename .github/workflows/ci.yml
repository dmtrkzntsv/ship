name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint cover

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: shellcheck -S warning test/e2e/e2e.sh
      - run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - run: sudo -E env "PATH=$PATH" make e2e
