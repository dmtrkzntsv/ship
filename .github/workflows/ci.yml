name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint test

  store:
    runs-on: ubuntu-latest
    env:
      SHIP_TEST_S3_ENDPOINT: http://localhost:9000
      SHIP_TEST_S3_ACCESS_KEY: minioadmin
      SHIP_TEST_S3_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "minio did not become healthy" >&2
          docker logs minio
          exit 1
      - run: |
          if [ -d internal/store ]; then
            go test ./internal/store/...
          else
            echo "no store package yet"
          fi
